<!DOCTYPE html>
<html>
<body>
<h2>Multiplication</h2>
<form name="myform">
    <input type="number" name="a" placeholder="First number">
    <br><br>

    <input type="number" name="b" placeholder="Second number">
    <br><br>

    <button type="button" onclick="multiply()">Multiply</button>
</form>
<script>
function multiply() {
    let a = document.forms["myform"]["a"].value;
    let b = document.forms["myform"]["b"].value;

    alert(a * b);
}
</script>
</body>
</html>
