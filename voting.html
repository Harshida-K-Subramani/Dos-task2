
<!DOCTYPE html>
<html>
<head>
    <title>Voting System</title>
    <style>
        body {
            font-family: Arial;
            background: #fff0f5;
            text-align: center;
        }
        .box {
            background: white;
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            border-radius: 15px;
        }
        button {
            background: #e75480;
            color: white;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            cursor: pointer;
        }
        h2 {
            color: #e75480;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Voting System</h2>

    <h3>Select Your Candidate</h3>

    <button onclick="vote('Candidate A')">Candidate A</button>
    <button onclick="vote('Candidate B')">Candidate B</button>
    <button onclick="vote('Candidate C')">Candidate C</button>

    <h3 id="result">Cast Your Vote!</h3>
</div>

<script>
let voted = false;

function vote(candidate) {
    if (voted) {
        document.getElementById("result").innerHTML =
            "You have already voted!";
    }
    else {
        document.getElementById("result").innerHTML =
            "You voted for " + candidate;
        voted = true;
    }
}
</script>

</body>
</html>
