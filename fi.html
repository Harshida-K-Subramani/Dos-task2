<!DOCTYPE html>
<html>
<body>

<h2>Multiplication</h2>

<form>
    <input type="number" placeholder="First number" name="a">
    <br><br>

    <input type="number" placeholder="Second number" name="b">
    <br><br>

    <button type="button" onclick="alert(this.form.a.value * this.form.b.value)">
        Multiply
    </button>
</form>

</body>
</html>
